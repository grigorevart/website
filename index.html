<style>
/* Layout: a dark room with one old terminal monitor filling the viewport.
   Casing (metal shell + plate, LED, phosphor switch, power button) wraps a curved CRT screen;
   inside the screen: scrolling log on top, command bar at the bottom. */
:root {
  /* room + casing */
  --room: #121410;
  --room-glow: #1d2119;
  --case-hi: #6a6d5c;
  --case: #4d5043;
  --case-lo: #33352c;
  --recess: #141510;
  --plate: #b9ae86;
  --plate-ink: #2c2a1f;
  --led-off: #3a2a14;
  --led-on: #ffb23e;
  /* phosphor screen (black version) */
  --bg: #020804;
  --glass: #05170c;
  --phosphor: #41ff8a;
  --phosphor-dim: #22a85a;
  --phosphor-faint: #0f4426;
  --ink: #021006;
  --glow: rgba(65, 255, 138, 0.5);
  --glow-wide: rgba(65, 255, 138, 0.22);
  --scan: rgba(0, 0, 0, 0.3);
  --vignette: rgba(0, 0, 0, 0.92);
  --band: rgba(65, 255, 138, 0.045);
  --font-term: "VT323", "Lucida Console", "Courier New", monospace;
  --font-label: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
/* White version: paper-white tube, dark green ink, lit room */
body[data-screen="light"] {
  --room: #b9bdb0;
  --room-glow: #d8dbcf;
  --bg: #dfe8dc;
  --glass: #f7fbf4;
  --phosphor: #0d5c2c;
  --phosphor-dim: #4c8560;
  --phosphor-faint: #b5cdb9;
  --ink: #f7fbf4;
  --glow: rgba(13, 92, 44, 0.18);
  --glow-wide: rgba(13, 92, 44, 0);
  --scan: rgba(0, 0, 0, 0.05);
  --vignette: rgba(60, 80, 60, 0.4);
  --band: rgba(13, 92, 44, 0.035);
}

html, body { height: 100%; }
* { box-sizing: border-box; }
body {
  margin: 0;
  background: radial-gradient(ellipse at 50% 40%, var(--room-glow) 0%, var(--room) 70%);
  color: var(--phosphor);
  font-family: var(--font-term);
  overflow: hidden;
  /* flex, not grid: the monitor's height:100% must resolve against the fixed body height,
     not an auto grid row that grows with the terminal text */
  display: flex;
  align-items: center;
  justify-content: center;
  padding-inline: 16px;
  padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-bottom, 0px));
  transition: background-color 0.4s;
}

/* ---------- monitor casing ---------- */
.monitor {
  position: relative;
  width: min(100%, 1180px);
  height: min(100%, 900px);
  display: flex;
  flex-direction: column;
  padding: clamp(14px, 3.2vw, 38px) clamp(12px, 3.6vw, 46px) 0;
  border-radius: clamp(16px, 2.6vw, 30px);
  background:
    radial-gradient(circle at 18px 18px, var(--case-lo) 0 3px, transparent 4px),
    radial-gradient(circle at calc(100% - 18px) 18px, var(--case-lo) 0 3px, transparent 4px),
    linear-gradient(170deg, var(--case-hi) 0%, var(--case) 35%, var(--case-lo) 100%);
  box-shadow:
    inset 0 2px 0 rgba(255, 255, 255, 0.18),
    inset 0 -3px 0 rgba(0, 0, 0, 0.35),
    inset 3px 0 0 rgba(255, 255, 255, 0.06),
    0 30px 60px rgba(0, 0, 0, 0.55),
    0 6px 0 var(--case-lo);
}
/* recessed well the tube sits in */
.bezel {
  flex: 1;
  min-height: 0;
  display: flex;
  padding: clamp(8px, 1.4vw, 16px);
  border-radius: clamp(14px, 2.2vw, 26px);
  background: var(--recess);
  box-shadow:
    inset 0 6px 14px rgba(0, 0, 0, 0.85),
    inset 0 -2px 0 rgba(255, 255, 255, 0.08),
    0 1px 0 rgba(255, 255, 255, 0.12);
}

/* ---------- control strip under the screen ---------- */
.controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: clamp(52px, 7vw, 74px);
  padding-block: 10px;
}
.plate {
  min-width: 0;
  padding: 5px 12px 4px;
  border-radius: 3px;
  background: linear-gradient(to bottom, var(--plate), #9c9270);
  color: var(--plate-ink);
  font-family: var(--font-label);
  font-weight: 700;
  font-size: clamp(10px, 1.1vw, 13px);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), 0 1px 2px rgba(0, 0, 0, 0.6);
}
.plate small { font-weight: 400; letter-spacing: 0.12em; opacity: 0.75; }
.knobs { display: flex; align-items: center; gap: clamp(12px, 2vw, 22px); flex-shrink: 0; }
.ctl {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  font-family: var(--font-label);
  font-size: 9px;
  letter-spacing: 0.14em;
  color: #c9c3a8;
  text-transform: uppercase;
  text-shadow: 0 1px 0 rgba(0, 0, 0, 0.6);
}
.led {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--led-off);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.7);
}
.monitor.on .led { background: var(--led-on); box-shadow: 0 0 8px var(--led-on), inset 0 -1px 2px rgba(0, 0, 0, 0.3); }
.monitor.busy .led { animation: led 0.18s steps(1) infinite; }

/* phosphor toggle: a chunky slide switch */
.switch {
  position: relative;
  width: 42px; height: 20px;
  padding: 0;
  border: 0;
  border-radius: 4px;
  background: #1b1c17;
  box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.9), 0 1px 0 rgba(255, 255, 255, 0.12);
  cursor: pointer;
}
.switch::after {
  content: "";
  position: absolute;
  top: 2px; left: 2px;
  width: 18px; height: 16px;
  border-radius: 3px;
  background: linear-gradient(to bottom, #d9d4bd, #8f8a72);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
  transition: transform 0.15s;
}
.switch[aria-pressed="true"]::after { transform: translateX(20px); }
.power {
  width: 26px; height: 26px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #8a8d78, #3c3e33 70%);
  box-shadow: 0 2px 3px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.25);
  cursor: pointer;
}
.power:active { transform: translateY(1px); box-shadow: 0 1px 1px rgba(0, 0, 0, 0.7); }
.switch:focus-visible, .power:focus-visible { outline: 2px solid var(--led-on); outline-offset: 3px; }

/* ---------- CRT tube ---------- */
.crt {
  position: relative;
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-radius: clamp(14px, 3vw, 38px) / clamp(12px, 2.6vw, 32px);
  background: radial-gradient(ellipse at center, var(--glass) 0%, var(--bg) 80%);
  font-size: clamp(18px, 2.1vw, 25px);
  line-height: 1.18;
  text-shadow: 0 0 3px var(--glow), 0 0 12px var(--glow-wide);
  animation: flicker 5s infinite steps(1);
  transition: background-color 0.3s;
}
.crt::before { /* scanlines */
  content: "";
  position: absolute; inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(to bottom, transparent 0 2px, var(--scan) 2px 3px);
  z-index: 3;
}
.crt::after { /* tube curvature + glass reflection */
  content: "";
  position: absolute; inset: 0;
  pointer-events: none;
  border-radius: inherit;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0) 32%);
  box-shadow: inset 0 0 120px var(--vignette), inset 0 0 18px rgba(0, 0, 0, 0.6);
  z-index: 4;
}
.roll {
  position: absolute; left: 0; right: 0; top: -20%;
  height: 18%;
  pointer-events: none;
  background: linear-gradient(to bottom, transparent 0%, var(--band) 50%, transparent 100%);
  animation: roll 7s linear infinite;
  z-index: 2;
}
#screen {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding-inline: clamp(14px, 2.6vw, 34px);
  padding-block: clamp(14px, 2.4vw, 30px) 10px;
  scrollbar-width: thin;
  scrollbar-color: var(--phosphor-faint) transparent;
  cursor: text;
}
#log { max-width: 80ch; }
.line { white-space: pre-wrap; overflow-wrap: anywhere; min-height: 1.18em; }
.dim { color: var(--phosphor-dim); }
.head { letter-spacing: 0.04em; }
.typed { text-transform: uppercase; }
.cursor {
  display: inline-block;
  width: 0.58em; height: 0.95em;
  margin-left: 1px;
  vertical-align: -0.12em;
  background: var(--phosphor);
  box-shadow: 0 0 8px var(--glow);
  animation: blink 1.06s steps(1) infinite;
}
.crt a { color: var(--phosphor); text-underline-offset: 3px; }
.crt a:hover, .crt a:focus-visible { background: var(--phosphor); color: var(--ink); text-shadow: none; outline: none; }

.bar {
  position: relative;
  z-index: 5;
  border-top: 2px solid var(--phosphor-faint);
  padding: 8px clamp(10px, 2vw, 24px) 10px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 2px 16px;
}
.bar button {
  font: inherit;
  color: var(--phosphor);
  text-shadow: inherit;
  background: none;
  border: 0;
  padding: 0 0.3em;
  cursor: pointer;
  letter-spacing: 0.04em;
}
.bar button:hover, .bar button:focus-visible { background: var(--phosphor); color: var(--ink); text-shadow: none; outline: none; }

#kbd {
  position: fixed; left: 0; bottom: 0;
  width: 1px; height: 1px;
  opacity: 0; border: 0; padding: 0;
  font-size: 16px; /* stops iOS zooming on focus */
}

@media (max-width: 560px) {
  .plate small { display: none; }
  .ctl span { display: none; }
  .bar { gap: 0 10px; }
}
@media (max-height: 520px) {
  .controls { min-height: 40px; padding-block: 6px; }
}

@keyframes blink { 50% { opacity: 0; } }
@keyframes led { 50% { opacity: 0.35; } }
@keyframes roll { to { top: 110%; } }
@keyframes flicker {
  0% { opacity: 1; } 31% { opacity: 0.97; } 32% { opacity: 1; }
  67% { opacity: 0.985; } 68% { opacity: 1; } 93% { opacity: 0.96; } 94% { opacity: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .crt, .roll, .monitor.busy .led { animation: none; }
  .roll { display: none; }
}
</style>
</head>

<script>
/* ==========================================================
   EDIT THIS: what the terminal prints.
   ========================================================== */
const RESUME = {
  name: "ARTEM GRIGOREV",
  role: "SITE RELIABILITY / DEVOPS ENGINEER",
  about: [
    "DevOps and SRE engineer. I automate and run infrastructure,",
    "from small setups to enterprise systems, in the cloud and on-prem.",
    "",
    "Strong background in Linux administration, networking and security.",
    "I apply software engineering to operations: more reliability, more",
    "automation, better observability. I work closely with developers,",
    "QA and product to keep infrastructure aligned with business goals.",
    "",
    "Off duty: new tech, travel, farming and gardening.",
  ],
  skills: [
    ["CLOUD", "AWS, GCP, AZURE"],
    ["CONTAINERS", "DOCKER, KUBERNETES"],
    ["IAC", "ANSIBLE, TERRAFORM, CDKTF, AWS CDK"],
    ["CI/CD", "GITLAB CI, ARGO WORKFLOWS, TEKTON"],
    ["GITOPS", "ARGOCD, FLUX"],
    ["DATA", "POSTGRESQL, MYSQL, MONGODB, REDIS, CASSANDRA"],
    ["OBSERVABILITY", "PROMETHEUS, GRAFANA, ELK, THANOS, LOKI, VICTORIAMETRICS, OPENTELEMETRY"],
    ["SECURITY", "HASHICORP VAULT, TRIVY, SONARQUBE"],
    ["CODE", "PYTHON, GOLANG, BASH"],
  ],
  certs: [
    ["ACTIVE ", "7x GOOGLE CLOUD, INCL. PROFESSIONAL CLOUD ARCHITECT, DEVOPS ENGINEER, SECURITY ENGINEER"],
    ["ACTIVE ", "3x AWS, INCL. SOLUTIONS ARCHITECT, SYSOPS"],
    ["PENDING", "MICROSOFT AZURE (IN PREPARATION)"],
    ["EXPIRED", "CKA, CKAD, CKS"],
    ["EXPIRED", "HASHICORP VAULT & TERRAFORM ASSOCIATE"],
    ["EXPIRED", "CISCO CCNA"],
  ],
  resumeUrl: "resume/resume.pdf",
  contact: [
    ["LINKEDIN", "linkedin.com/in/artem-grigorev-9aaa65185", "https://linkedin.com/in/artem-grigorev-9aaa65185"],
    ["TELEGRAM", "t.me/artemgr94", "https://t.me/artemgr94"],
    ["EMAIL", "contact@artemgrigorev.com", "mailto:contact@artemgrigorev.com"],
  ],
};

/* ---------- terminal engine ---------- */
const monitor = document.getElementById("monitor");
const screen = document.getElementById("screen");
const log = document.getElementById("log");
const kbd = document.getElementById("kbd");

const CHARS_PER_TICK = 3, TICK_MS = 12, LINE_GAP_MS = 18;
let queue = [], busy = false, skip = false, autoTyping = false;
let inputLine = null, typedEl = null;
const history = [];
let hIdx = 0;

function say(text = "", cls = "") { queue.push({ text, cls }); }
function link(prefix, label, href) { queue.push({ text: prefix + label, cls: "", href, label }); }
function pause(ms) { queue.push({ pause: ms }); }
function wipe() { queue.push({ wipe: true }); }
function scrollDown() { screen.scrollTop = screen.scrollHeight; }
function setBusy(b) { busy = b; monitor.classList.toggle("busy", b); }
function start() { if (!busy) pump(); }

function pump() {
  setBusy(true);
  const item = queue.shift();
  if (!item) { setBusy(false); skip = false; showPrompt(); return; }
  if (item.pause) { setTimeout(pump, skip ? 0 : item.pause); return; }
  if (item.wipe) { log.innerHTML = ""; pump(); return; }

  const el = document.createElement("div");
  el.className = "line " + item.cls;
  log.appendChild(el);
  const t = item.text;
  let i = 0;

  const finish = () => {
    if (item.href) {
      el.textContent = "";
      const a = document.createElement("a");
      a.href = item.href;
      if (/^https?:/.test(item.href)) { a.target = "_blank"; a.rel = "noopener"; }
      a.textContent = item.label;
      el.append(t.slice(0, t.length - item.label.length), a);
    } else {
      el.textContent = t;
    }
    scrollDown();
    setTimeout(pump, skip ? 0 : LINE_GAP_MS);
  };
  (function tick() {
    if (skip || i >= t.length) return finish();
    i = Math.min(t.length, i + CHARS_PER_TICK);
    el.textContent = t.slice(0, i);
    if (i % 9 < CHARS_PER_TICK) blip(2400, 0.008, 0.012);
    scrollDown();
    setTimeout(tick, TICK_MS);
  })();
}

function showPrompt() {
  inputLine = document.createElement("div");
  inputLine.className = "line";
  inputLine.innerHTML = '<span>&gt; </span><span class="typed"></span><span class="cursor"></span>';
  typedEl = inputLine.querySelector(".typed");
  log.appendChild(inputLine);
  kbd.value = "";
  scrollDown();
}

function submit() {
  if (!inputLine) return;
  const raw = kbd.value.trim();
  inputLine.querySelector(".cursor").remove();
  inputLine = null;
  kbd.value = "";
  if (raw) history.push(raw);
  hIdx = history.length;
  blip(900, 0.05, 0.03);
  run(raw);
  start();
}

/* ---------- sound: tiny square-wave clicks, enabled by the first key press ---------- */
let ac = null, soundOn = true;
function blip(freq = 1800, dur = 0.02, vol = 0.03) {
  if (!soundOn || !ac) return;
  try {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "square";
    o.frequency.value = freq * (0.9 + Math.random() * 0.2);
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    o.connect(g).connect(ac.destination);
    o.start();
    o.stop(ac.currentTime + dur);
  } catch (e) {}
}
function wakeAudio() {
  if (ac) return;
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
}

/* ---------- black / white screen ---------- */
const screenToggle = document.getElementById("screenToggle");
let screenMode = "dark";
function setScreen(mode) {
  screenMode = mode;
  if (mode === "light") document.body.dataset.screen = "light";
  else delete document.body.dataset.screen;
  screenToggle.setAttribute("aria-pressed", String(mode === "light"));
  screenToggle.setAttribute("aria-label", mode === "light" ? "Black screen" : "White screen");
  try { localStorage.setItem("termlink-screen", mode); } catch (e) {}
}
try { if (localStorage.getItem("termlink-screen") === "light") setScreen("light"); } catch (e) {}

/* ---------- commands ---------- */
const rule = "=".repeat(44);
const dots = (label, w) => (label + " ").padEnd(w, ".") + " ";

const COMMANDS = {
  help: {
    desc: "LIST COMMANDS",
    run() {
      say("AVAILABLE COMMANDS:", "head");
      say("");
      for (const [name, c] of Object.entries(COMMANDS)) {
        if (!c.hidden) say("  " + dots(name.toUpperCase(), 12) + c.desc);
      }
      say("");
      say("UP/DOWN: HISTORY   TAB: COMPLETE   ANY KEY: SKIP TEXT", "dim");
    },
  },
  about: {
    desc: "WHO OWNS THIS TERMINAL",
    run() {
      say("PERSONNEL FILE: " + RESUME.name, "head");
      say(rule, "dim");
      say("DESIGNATION : " + RESUME.role);
      say("");
      RESUME.about.forEach(l => say(l));
    },
  },
  skills: {
    desc: "TOOLS AND TECHNOLOGIES",
    run() {
      say("TOOLS AND TECHNOLOGIES", "head");
      say(rule, "dim");
      RESUME.skills.forEach(([k, v]) => say(dots(k, 16) + v));
    },
  },
  certs: {
    desc: "CERTIFICATIONS",
    run() {
      say("CERTIFICATIONS", "head");
      say(rule, "dim");
      RESUME.certs.forEach(([state, c]) => say("[" + state + "] " + c, state === "EXPIRED" ? "dim" : ""));
      say("");
      say("(HOPEFULLY I'LL RENEW THE EXPIRED ONES ONE DAY)", "dim");
    },
  },
  resume: {
    desc: "FULL SERVICE RECORD (PDF)",
    run() {
      say("SERVICE RECORD", "head");
      say(rule, "dim");
      link("OPEN: ", "resume.pdf", RESUME.resumeUrl);
    },
  },
  contact: {
    desc: "OPEN A COMM CHANNEL",
    run() {
      say("COMM CHANNELS", "head");
      say(rule, "dim");
      RESUME.contact.forEach(([k, v, href]) => link(k.padEnd(9) + ": ", v, href));
    },
  },
  ls: {
    desc: "LIST FILES",
    run() { say("ABOUT.TXT  SKILLS.DAT  CERTS.DAT  RESUME.PDF  CONTACT.TXT"); },
  },
  cat: {
    desc: "READ A FILE",
    run(arg) {
      if (!arg) return say("USAGE: CAT <FILE>   (TRY LS)", "dim");
      const key = arg.toLowerCase().split(".")[0];
      if (FILES.includes(key)) return COMMANDS[key].run();
      say("CAT: " + arg.toUpperCase() + ": NO SUCH FILE", "dim");
    },
  },
  clear: { desc: "WIPE THE SCREEN", run() { wipe(); } },
  theme: {
    desc: "BLACK / WHITE SCREEN",
    run(arg) {
      const a = (arg || "").toLowerCase();
      const next = a === "white" || a === "light" ? "light"
        : a === "black" || a === "dark" ? "dark"
        : (screenMode === "light" ? "dark" : "light");
      setScreen(next);
      say("SCREEN: " + (next === "light" ? "WHITE" : "BLACK"));
    },
  },
  sound: {
    desc: "KEY CLICKS ON / OFF",
    run(arg) {
      soundOn = arg ? arg.toLowerCase() !== "off" : !soundOn;
      say("KEY CLICKS: " + (soundOn ? "ON" : "OFF"));
    },
  },
  reboot: { desc: "RESTART THE TERMINAL", run() { wipe(); boot(true); } },

  // easter eggs, not listed in HELP
  whoami: { hidden: true, run() { say("GUEST. CLEARANCE: RECRUITER (PROBABLY)."); } },
  sudo: { hidden: true, run() { say("ACCESS DENIED. NICE TRY."); } },
  hack: { hidden: true, run() { say("TERMINAL LOCKED. PLEASE CONTACT AN ADMINISTRATOR."); pause(700); say("...JUST KIDDING. TYPE CONTACT.", "dim"); } },
  exit: { hidden: true, run() { say("THERE IS NO EXIT. ONLY THE WASTELAND."); } },
  date: {
    hidden: true,
    run() {
      const d = new Date();
      say(String(d.getMonth() + 1).padStart(2, "0") + "." + String(d.getDate()).padStart(2, "0") + "." +
        (d.getFullYear() + 261) + "  " + d.toTimeString().slice(0, 5));
    },
  },
};
const ALIASES = {
  "?": "help", cls: "clear", certifications: "certs",
  cv: "resume", experience: "resume", exp: "resume", work: "resume",
  white: "theme white", light: "theme white", black: "theme black", dark: "theme black",
};
const FILES = ["about", "skills", "certs", "resume", "contact"];

function run(raw) {
  if (!raw) return;
  let [word, ...rest] = raw.split(/\s+/);
  const alias = ALIASES[word.toLowerCase()];
  if (alias) { const [w, ...r] = alias.split(" "); word = w; rest = r.concat(rest); }
  const cmd = COMMANDS[word.toLowerCase()];
  if (!cmd) {
    say("ERROR: '" + word.toUpperCase() + "' IS NOT A RECOGNIZED COMMAND.");
    say("TYPE HELP FOR A LIST.", "dim");
    return;
  }
  cmd.run(rest.join(" "));
}

/* ---------- boot: full sequence once per browser session, short after that ---------- */
function boot(full) {
  let seen = false;
  try { seen = sessionStorage.getItem("termlink-booted") === "1"; sessionStorage.setItem("termlink-booted", "1"); } catch (e) {}
  if (full || !seen) {
    say("GRIGOREV INDUSTRIES (TM) TERMLINK PROTOCOL", "head");
    say("> SET TERMINAL/INQUIRE", "dim");
    say("GI-3000", "dim");
    say("> SET FILE/PROTECTION=OWNER:RWED RESUME.F", "dim");
    say("> SET HALT RESTART/MAINT", "dim");
    say("Initializing Grigorev Industries(TM) MF Boot Agent v2.3.0", "dim");
    say("RETROS BIOS  RBIOS-4.02.08.00 52EE5.E7.E8", "dim");
    say("Uppermem: 64 KB   Root (5A8)   Maintenance Mode", "dim");
    say("> LOGON GUEST", "dim");
    pause(350);
    say("PASSWORD: ********", "dim");
    pause(500);
    say("ACCESS GRANTED.");
    pause(700);
    wipe();
  }
  say("GRIGOREV INDUSTRIES (TM) TERMLINK PROTOCOL", "head");
  say("PERSONNEL FILE: " + RESUME.name + "  //  " + RESUME.role, "dim");
  say(rule, "dim");
  say("");
  say("Welcome, visitor. This terminal holds one resume.");
  say("Type HELP and press ENTER, or pick a section below.");
  say("");
}

/* ---------- input wiring ---------- */
kbd.addEventListener("input", () => {
  if (!inputLine || autoTyping) { if (!inputLine) kbd.value = ""; return; }
  typedEl.textContent = kbd.value;
  blip();
  scrollDown();
});

kbd.addEventListener("keydown", e => {
  wakeAudio();
  if (busy) { skip = true; e.preventDefault(); return; }
  if (autoTyping) { e.preventDefault(); return; }
  if (e.key === "Enter") { e.preventDefault(); submit(); return; }
  if (e.key === "l" && e.ctrlKey) { e.preventDefault(); log.innerHTML = ""; showPrompt(); return; }
  if (e.key === "ArrowUp" || e.key === "ArrowDown") {
    e.preventDefault();
    if (!history.length) return;
    hIdx = Math.max(0, Math.min(history.length, hIdx + (e.key === "ArrowUp" ? -1 : 1)));
    kbd.value = history[hIdx] || "";
    typedEl.textContent = kbd.value;
    return;
  }
  if (e.key === "Tab") {
    e.preventDefault();
    const v = kbd.value.toLowerCase();
    if (!v) return;
    const hits = Object.keys(COMMANDS).filter(c => !COMMANDS[c].hidden && c.startsWith(v));
    if (hits.length === 1) { kbd.value = hits[0]; typedEl.textContent = kbd.value; blip(); }
  }
});

// Any keypress anywhere goes to the terminal
document.addEventListener("keydown", e => {
  if (e.target === kbd || e.target.closest("button, a")) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  wakeAudio();
  if (busy) skip = true;
  kbd.focus({ preventScroll: true });
});

// Tap/click on the screen brings the keyboard up (unless the visitor is selecting text)
screen.addEventListener("click", e => {
  if (e.target.closest("a")) return;
  if (String(window.getSelection())) return;
  wakeAudio();
  if (busy) skip = true;
  kbd.focus({ preventScroll: true });
});

// Command bar: types the command into the prompt, then runs it
document.querySelectorAll(".bar button[data-cmd]").forEach(btn => {
  btn.addEventListener("click", () => {
    wakeAudio();
    if (busy) { skip = true; return; }
    if (!inputLine || autoTyping) return;
    const cmd = btn.dataset.cmd;
    autoTyping = true;
    kbd.value = "";
    let i = 0;
    (function type() {
      if (i < cmd.length) {
        kbd.value += cmd[i++];
        typedEl.textContent = kbd.value;
        blip();
        setTimeout(type, 45);
      } else {
        autoTyping = false;
        submit();
        kbd.focus({ preventScroll: true });
      }
    })();
  });
});

// Casing controls
screenToggle.addEventListener("click", () => {
  wakeAudio();
  setScreen(screenMode === "light" ? "dark" : "light");
  blip(1200, 0.04, 0.03);
});
document.getElementById("powerBtn").addEventListener("click", () => {
  wakeAudio();
  blip(300, 0.12, 0.05);
  queue = [];
  skip = false;
  inputLine = null;
  monitor.classList.remove("on");
  log.innerHTML = "";
  const restart = () => { monitor.classList.add("on"); boot(true); start(); };
  if (busy) { skip = true; setTimeout(() => { queue = []; skip = false; log.innerHTML = ""; restart(); }, 60); }
  else setTimeout(restart, 400);
});

boot(false);
start();
kbd.focus({ preventScroll: true });
</script>
